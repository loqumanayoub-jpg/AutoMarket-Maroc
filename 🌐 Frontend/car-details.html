<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Car Details - AutoMarket Maroc</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Restored car details layout and constrained main image size (page-scoped overrides) */
    .car-detail-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: start;
      margin-top: 8px;
    }

    .details-gallery {
      max-width: 720px;
    }

    .details-gallery .main-image {
      width: 100%;
      height: 420px;
      object-fit: cover;
      border-radius: 14px;
      background: #f1f5f9;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .08);
      display: block;
    }

    .gallery-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .thumbnails {
      display: flex;
      gap: 8px;
      margin-left: 6px;
      overflow-x: auto;
      align-items: center;
    }

    .thumbnail {
      width: 72px;
      height: 54px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      opacity: 0.9;
      border: 1px solid #e2e8f0;
    }

    .thumbnail.active {
      outline: 3px solid rgba(16,185,129,0.12);
      box-shadow: 0 10px 30px rgba(15, 23, 42, .08);
      opacity: 1;
    }

    .details-info {
      max-width: 520px;
    }

    @media (max-width: 900px) {
      .car-detail-layout { grid-template-columns: 1fr; }
      .details-gallery .main-image { height: 320px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <a href="index.html" style="display:flex; align-items:center; gap:12px; text-decoration:none;">
          <img id="logoImg" src="images/logo/logo.png" alt="AutoMarket Maroc logo">
          <h1 id="dealerName">AutoMarket Maroc</h1>
        </a>
      </div>
      <nav class="main-nav">
        <a href="index.html#home">Home</a>
        <a href="index.html#cars">Cars</a>
        <a href="index.html#sell">Sell</a>
        <a href="index.html#features">Features</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <div class="contact-sm">
        <a id="whatsappHeader" href="#" target="_blank" class="whatsapp-btn-sm">Direct WhatsApp</a>
        <a id="phoneLink" href="#">Call</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 40px 0;">
    <a href="index.html#cars" class="btn secondary" style="margin-bottom: 20px;">← Back to Cars</a>
    
    <!-- Single container used by the canonical external renderer -->
    <div id="carDetails"></div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <h3>AutoMarket Maroc</h3>
        <p>Your trusted dealership for buying and selling cars in Morocco.</p>
      </div>
      <div class="footer-links">
        <a href="index.html#home">Home</a>
        <a href="index.html#cars">Cars</a>
        <a href="index.html#sell">Sell</a>
        <a href="index.html#features">Features</a>
        <a href="index.html#contact">Contact</a>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 AutoMarket Maroc — All rights reserved.</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/cars.js"></script>
  <!-- canonical external renderer for the details page -->
  <script src="js/car-details.js"></script>
</body>
</html>
