<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - AutoMarket Maroc</title>
  <link rel="stylesheet" href="../🌐 Frontend/css/style.css">
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
  <script src="../🌐 Frontend/js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <main class="container">
    <h1>Admin Dashboard</h1>

    <nav>
      <a href="cars.html">Cars</a> |
      <a href="messages.html">Messages</a> |
      <a href="settings.html">Settings</a> |
      <button id="logoutBtn" class="btn btn-light">Logout</button>
    </nav>

    <section id="dashboardContent">
      <p>Loading dashboard overview...</p>
    </section>

    <script>
      // Small dashboard overview loader: queries simple counts and shows a brief summary.
      document.addEventListener('DOMContentLoaded', async () => {
        const container = document.getElementById('dashboardContent');
        if (!container) return;

        if (!window.supabase || typeof window.supabase.from !== 'function') {
          container.innerHTML = '<p style="color:crimson">Supabase client not initialized. Please reload the page.</p>';
          return;
        }

        try {
          // total cars
          const totalRes = await window.supabase.from('cars').select('id', { count: 'exact' }).limit(1);
          if (totalRes.error) throw totalRes.error;
          const total = totalRes.count || 0;

          // available cars
          const availRes = await window.supabase.from('cars').select('id', { count: 'exact' }).eq('status','available').limit(1);
          if (availRes.error) throw availRes.error;
          const available = availRes.count || 0;

          container.innerHTML = `
            <div class="dashboard-overview" style="display:flex; gap:12px; flex-wrap:wrap; align-items:stretch;">
              <div style="background:white; padding:14px; border-radius:10px; box-shadow: var(--shadow); min-width:160px;">
                <div style="font-size:13px; color:var(--muted)">Total cars</div>
                <div style="font-size:20px; font-weight:700">${total}</div>
              </div>
              <div style="background:white; padding:14px; border-radius:10px; box-shadow: var(--shadow); min-width:160px;">
                <div style="font-size:13px; color:var(--muted)">Available</div>
                <div style="font-size:20px; font-weight:700; color:var(--primary)">${available}</div>
              </div>
              <div style="flex:1 1 300px; background:white; padding:14px; border-radius:10px; box-shadow: var(--shadow);">
                <div style="font-size:13px; color:var(--muted)">Quick actions</div>
                <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
                  <a href="cars.html" class="btn btn-primary">Manage Cars</a>
                  <a href="messages.html" class="btn btn-light">Messages</a>
                </div>
              </div>
            </div>
          `;
        } catch (err) {
          console.error('Dashboard overview load failed:', err);
          container.innerHTML = '<p style="color:crimson">Failed to load dashboard overview. Check console for details.</p>';
        }
      });
    </script>

  </main>

  <script>
    // Use the shared client exposed by ../🌐 Frontend/js/supabase.js (window.supabase)
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        if (window.supabase && window.supabase.auth && typeof window.supabase.auth.signOut === 'function') {
          await window.supabase.auth.signOut();
        }
      } catch (err) {
        console.error('Logout failed:', err);
      }
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
