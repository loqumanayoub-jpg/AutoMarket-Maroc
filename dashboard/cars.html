<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة السيارات — AutoMarket Maroc</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar and Content Header -->
        <main class="main-content">
            <header class="content-header">
                <h1>إدارة السيارات</h1>
                <div class="header-actions">
                    <span id="userEmail"></span>
                    <button id="refreshBtn" class="btn btn-sm btn-primary">تحديث</button>
                    <button onclick="logout()" class="btn btn-sm btn-outline">خروج</button>
                </div>
            </header>

            <section class="cars-controls">
                <form id="searchForm" class="search-form">
                    <input type="text" id="searchBrand" placeholder="بحث بالعلامة" />
                    <input type="text" id="searchModel" placeholder="بحث بالنوع" />
                    <input type="text" id="searchCity" placeholder="بحث بالمدينة" />

                    <select id="filterStatus">
                        <option value="">حالة - الكل</option>
                        <option value="available">Available</option>
                        <option value="sold">Sold</option>
                        <option value="unlisted">Unlisted</option>
                    </select>

                    <select id="filterFuel">
                        <option value="">وقود - الكل</option>
                        <option value="Diesel">Diesel</option>
                        <option value="Petrol">Petrol</option>
                        <option value="Electric">Electric</option>
                        <option value="Hybrid">Hybrid</option>
                    </select>

                    <select id="filterTransmission">
                        <option value="">نقل - الكل</option>
                        <option value="Manual">Manual</option>
                        <option value="Automatic">Automatic</option>
                    </select>

                    <button id="searchBtn" class="btn btn-sm btn-primary">بحث</button>
                    <button id="clearBtn" class="btn btn-sm" type="button">مسح</button>
                </form>
            </section>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>الصورة</th>
                        <th>العلامة والنوع</th>
                        <th>السنة</th>
                        <th>الثمن</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="carsTableBody">
                    <!-- Cars rendered here -->
                </tbody>
            </table>
        </main>
    </div>

    <!-- Scripts Order -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../🌐 Frontend/js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cars.js"></script>
</body>
</html>
