<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة السيارات — AutoMarket Maroc</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar and Content Header -->
        <main class="main-content">
            <header class="content-header">
                <h1>إدارة السيارات</h1>
                <div class="header-actions">
                    <span id="userEmail"></span>
                    <button id="refreshBtn" class="btn btn-sm btn-primary">تحديث</button>
                    <button onclick="logout()" class="btn btn-sm btn-outline">خروج</button>
                </div>
            </header>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>الصورة</th>
                        <th>العلامة والنوع</th>
                        <th>السنة</th>
                        <th>الثمن</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="carsTableBody">
                    <!-- Cars rendered here -->
                </tbody>
            </table>
        </main>
    </div>

    <!-- Scripts Order -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../🌐 Frontend/js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cars.js"></script>
</body>
</html>
