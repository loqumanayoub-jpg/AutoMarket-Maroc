<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الرسائل - AutoMarket Maroc</title>
  <link rel="stylesheet" href="../🌐 Frontend/css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-app">
  <div class="dashboard-shell">
    <aside class="sidebar-panel">
      <div>
        <div class="brand-lockup">
          <img src="../🌐 Frontend/images/logo/logo.png" alt="AutoMarket Maroc Logo">
          <div>
            <strong>AutoMarket Maroc</strong>
            <span>Admin workspace</span>
          </div>
        </div>

        <nav class="sidebar-nav" aria-label="Sidebar navigation">
          <a href="dashboard.html" class="nav-item">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5 9.5V20h14V9.5" /></svg></span>
            <span>لوحة التحكم</span>
          </a>
          <a href="cars.html" class="nav-item">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14.5h18M5 14.5l1.5-5h11L19 14.5M7 18.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm10 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z" /></svg></span>
            <span>السيارات</span>
          </a>
          <a href="messages.html" class="nav-item active">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v7A2.5 2.5 0 0 1 17.5 17H10l-6 4v-4.5A2.5 2.5 0 0 1 4 14.5v-7Z" /></svg></span>
            <span>الرسائل</span>
          </a>
          <a href="settings.html" class="nav-item">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v2m0 13v2m8.5-8.5h-2M5.5 12h-2m14.1 7.1-1.4-1.4M8.8 8.8 7.4 7.4m9.2 0-1.4 1.4M8.8 15.2l-1.4 1.4M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z" /></svg></span>
            <span>الإعدادات</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <button id="logoutBtn" type="button" class="btn btn-logout">تسجيل الخروج</button>
      </div>
    </aside>

    <div class="dashboard-main">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title">الرسائل</div>
        </div>

        <div class="topbar-actions">
          <button id="notificationButton" type="button" class="icon-button" aria-label="Notifications" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5m6 0a3 3 0 1 1-6 0" /></svg>
            <span id="notificationBadge" class="icon-badge" hidden>0</span>
          </button>

          <div class="lang-switcher" aria-label="Language selector">
            <button type="button" class="lang-option active" data-lang="ar">AR</button>
            <button type="button" class="lang-option" data-lang="fr">FR</button>
            <button type="button" class="lang-option" data-lang="en">EN</button>
          </div>

          <button type="button" id="profileTrigger" class="admin-pill" aria-expanded="false" aria-haspopup="menu">
            <div class="admin-avatar">AM</div>
            <div>
              <strong>Admin</strong>
              <small>Operations</small>
            </div>
          </button>
        </div>
      </header>

      <div id="notificationPanel" class="notification-panel hidden" aria-live="polite">
        <div class="panel-header compact">
          <div>
            <p class="eyebrow">Notifications</p>
            <h3>الإشعارات</h3>
          </div>
          <button type="button" class="btn btn-ghost" id="markNotificationsRead">تحديد كمقروء</button>
        </div>
        <div id="notificationList" class="notification-list"></div>
      </div>

      <div id="profileMenu" class="profile-menu hidden" role="menu" aria-label="Profile menu">
        <button type="button" class="profile-menu-item" data-action="profile">Profile</button>
        <button type="button" class="profile-menu-item" data-action="settings">Settings</button>
        <button type="button" class="profile-menu-item" data-action="language">Language</button>
        <button type="button" class="profile-menu-item" data-action="appearance">Appearance</button>
        <button type="button" class="profile-menu-item danger" data-action="logout">Logout</button>
      </div>

      <main class="dashboard-content">
        <section class="page-head">
          <div>
            <p class="eyebrow">Messages</p>
            <h1>سجل الرسائل</h1>
          </div>
        </section>

        <section class="panel-card">
          <div id="messagesArea">
            <div class="loading">جارٍ تحميل الرسائل…</div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <dialog id="messageModal" class="message-modal">
    <div class="modal-body" id="messageModalBody"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../🌐 Frontend/js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard-shell.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
